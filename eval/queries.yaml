- id: q066
  lang: de
  query: Lithiumproblem der primordialen Nukleosynthese
  intent: >
    Papers on the cosmological lithium problem, the mismatch between Big Bang nucleosynthesis predictions
    of lithium-7 and abundances measured in old metal-poor stars, including nuclear, stellar depletion or
    new-physics explanations. Not relevant: BBN constraints on deuterium or helium alone, or lithium in
    young stars and planets with no link to the primordial abundance.
  subfield: CO
  kind: topical

- id: q067
  lang: de
  query: massenkalibrierung von galaxienhaufen mit schwachem gravitationslinseneffekt
  intent: >
    Papers that calibrate galaxy cluster masses or mass-observable relations using weak gravitational
    lensing, including stacked shear profiles and systematics such as miscentring or source dilution,
    often for cluster cosmology. Not relevant: strong lensing mass models of individual clusters, or
    cluster masses from X-ray or SZ data only.
  subfield: CO
  kind: method

- id: q068
  lang: de
  query: Quasar-Dipol widerlegt das kosmologische Prinzip
  intent: >
    Papers arguing that the dipole in the number counts of distant quasars or radio galaxies is too large
    to be a kinematic effect, implying a violation of large-scale isotropy or of the cosmological
    principle. Papers finding consistency with the CMB dipole are relevant only if they directly test
    this anomaly. Not relevant: the CMB dipole alone, or general tests of statistical isotropy in the CMB.
  subfield: CO
  kind: contrarian

- id: q069
  lang: de
  query: DART Einschlag Dimorphos Auswurfmaterial
  intent: >
    Papers on the outcome of the DART impact on Dimorphos, including ejecta, the debris tail, momentum
    transfer, changes to the binary orbit or shape, and preparation for the Hera mission. Not relevant:
    general planetary defence studies or other binary asteroids with no reference to DART or Dimorphos.
  subfield: EP
  kind: identifier

- id: q070
  lang: de
  query: gibt es plattentektonik auf super-erden
  intent: >
    Papers that model or constrain the tectonic regime (plate tectonics, stagnant lid, episodic overturn)
    of rocky exoplanets, especially super-Earths, and its dependence on mass, composition or interior
    heating. Not relevant: plate tectonics on Earth only, or exoplanet interior structure without
    tectonics.
  subfield: EP
  kind: question

- id: q071
  lang: de
  query: Exoplaneten direkt beobachten mit optischer Interferometrie GRAVITY
  intent: >
    Papers that use optical or near-infrared long-baseline interferometry, especially VLTI/GRAVITY, to
    detect, characterise or measure orbits and spectra of exoplanets or brown dwarf companions. Not
    relevant: single-telescope coronagraphic imaging, or interferometry of stars or AGN without companions.
  subfield: EP
  kind: method

- id: q072
  lang: de
  query: sterne die aus dem zentrum der milchstraße herausgeschleudert werden
  intent: >
    Papers on hypervelocity stars and other high-velocity stars ejected from the Galactic Centre, for
    example via the Hills mechanism, including searches, kinematic origins and constraints on Sgr A* or
    the Galactic potential. Not relevant: runaway stars from supernova kicks in the disk, or stellar
    orbits close to Sgr A* without ejection.
  subfield: GA
  kind: synonym

- id: q073
  lang: de
  query: Gaia-Enceladus-Sausage Verschmelzung
  intent: >
    Papers studying the Gaia-Enceladus/Sausage accretion event, including its stellar debris, chemistry,
    mass, timing and influence on the formation of the Milky Way's inner halo and thick disk, or arguing
    whether it was a single merger. Not relevant: other Milky Way accretion events or stellar streams that
    do not discuss Gaia-Enceladus.
  subfield: GA
  kind: identifier

- id: q074
  lang: de
  query: galaktische PeVatrone und Mikroquasare
  intent: >
