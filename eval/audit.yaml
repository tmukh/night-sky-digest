  arxiv_id: '2608.24456'
  url: https://arxiv.org/abs/2608.24456
  title: CMB Birefringence from Axion String Networks Calibrated to an AMR Simulation
  abstract: A cosmological network of axion strings may exist in the Universe today. If axion-like particles
    couple to electromagnetism, such a network induces spatially varying birefringence in the polarization
    of the cosmic microwave background (CMB), which can be probed by current and next-generation CMB experiments.
    We calibrate a loop-crossing model against a large-scale adaptive-mesh-refinement (AMR) simulation
    of axion-string network dynamics in the early Universe and use the calibrated model to predict CMB
    birefringence from recombination to today. We find that the non-detection of anisotropic birefringence
