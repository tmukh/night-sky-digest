- query_id: q025
  query: what are the little red dots in JWST images
  intent: 'Papers that characterise or explain "little red dots", the compact red sources at high redshift
    discovered with JWST, whether as dust-reddened AGN, compact starbursts, black hole stars or dense
    gas envelopes. Not relevant: general high-redshift AGN or dusty galaxies that do not address this
    population.'
  arxiv_id: '2606.02539'
  url: https://arxiv.org/abs/2606.02539
  title: JWST's Little Red Dots as collapsed Supermassive Dark Stars
  abstract: 'The nature of the ``Little Red Dots'''' (LRDs) is one of the most profound mysteries posed
    by the JWST data. One promising class of models that can reproduce the observed LRDs spectra and morphology
    are quasi-stars: massive envelopes surrounding accreting black holes formed via the collapse of supermassive
    stars (SMSs). However, the canonical SMS pathway relies on a highly restricted set of environmental
    and structural conditions: strong Lyman--Werner (LW) backgrounds to suppress H$_2$ cooling, high and
    sustained gas inflow rates to enforce entropy stratified envelopes, and assume non-zero rotational
    support in order to prevent GR instability collapse before $\sim 10^6 M_{\odot}$. Here we show that
    supermassive dark stars (SMDSs), powered by dark matter (DM) annihilation rather than nuclear burning,
    naturally satisfy the key structural and energetic requirements for quasi-star (QS) formation while
    relaxing {\it all} of those restrictive conditions listed above. Moreover, quasi-stars formed through
    the SMDS pathway are born with prompt BH masses ($\gtrsim 10\%$) of the progenitor mass. They therefore
    enter directly into a late-stage quasi-star regime; subsequently the envelope expands and cools until
    its photosphere reaches the zero-metallicity opacity limit $(T_{\rm eff}\sim3000$-$6000\,{\rm K}$).
    Those cool, optically thick, unresolved photospheres can reproduce key features of many JWST LRDs.'
  judges:
